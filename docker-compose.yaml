services:
  eureka-server:
    image: eureka-server
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - gym-microservices-net
    environment:
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT}
      - LOGGING_FILE_NAME=${LOGGING_FILE_NAME}
      - LOGGING_PATTERN_CONSOLE=${LOGGING_PATTERN_CONSOLE}
      - LOGGING_PATTERN_FILE=${LOGGING_PATTERN_FILE}
      - SPRING_JPA_SHOW_SQL=false

  gym-app:
    image: gym-app
    build:
      context: ./gym-app
    ports:
      - "8081:8081"
    networks:
      - gym-microservices-net
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DRIVER_CLASS_NAME=${DB_DRIVER_CLASS_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8761
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT}
      - LOGGING_FILE_NAME=${LOGGING_FILE_NAME}
      - LOGGING_PATTERN_CONSOLE=${LOGGING_PATTERN_CONSOLE}
      - LOGGING_PATTERN_FILE=${LOGGING_PATTERN_FILE}
      - CORRELATION_ID_HEADER=${CORRELATION_ID_HEADER}
      - SPRING_ACTIVEMQ_BROKER_URL=${ACTIVEMQ_BROKER_URL}
      - SPRING_ACTIVEMQ_USER=${ACTIVEMQ_USER}
      - SPRING_ACTIVEMQ_PASSWORD=${ACTIVEMQ_PASSWORD}
      - APP_TRAINER_WORKLOAD_QUEUE_NAME=${APP_TRAINER_WORKLOAD_QUEUE_NAME}
      - SPRING_JPA_SHOW_SQL=false

  trainer-stats-app:
    image: trainer-stats-app
    build:
      context: ./trainer-stats-app
    ports:
      - "8082:8082"
    networks:
      - gym-microservices-net
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT}
      - LOGGING_FILE_NAME=${LOGGING_FILE_NAME}
      - LOGGING_PATTERN_CONSOLE=${LOGGING_PATTERN_CONSOLE}
      - LOGGING_PATTERN_FILE=${LOGGING_PATTERN_FILE}
      - CORRELATION_ID_HEADER=${CORRELATION_ID_HEADER}
      - SPRING_ACTIVEMQ_BROKER_URL=${ACTIVEMQ_BROKER_URL}
      - SPRING_ACTIVEMQ_USER=${ACTIVEMQ_USER}
      - SPRING_ACTIVEMQ_PASSWORD=${ACTIVEMQ_PASSWORD}
      - APP_TRAINER_WORKLOAD_QUEUE_NAME=${APP_TRAINER_WORKLOAD_QUEUE_NAME}
      - SPRING_JPA_SHOW_SQL=false

  mysql:
    image: mysql:latest
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gym-microservices-net
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  activemq:
    image: apache/activemq-classic:latest
    ports:
      - "61616:61616"
    networks:
      - gym-microservices-net

  prometheus:
    image: prom/prometheus:v2.35.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    ports:
      - 9090:9090
    networks:
      - gym-microservices-net

  grafana:
    image: grafana/grafana-oss:8.5.2
    pull_policy: always
    container_name: grafana
    restart: unless-stopped
    user: root
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN}
      - GF_LOG_MODE=${GF_LOG_MODE}
      - GF_LOG_FILTERS=${GF_LOG_FILTERS}
    networks:
      - gym-microservices-net

networks:
  gym-microservices-net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: